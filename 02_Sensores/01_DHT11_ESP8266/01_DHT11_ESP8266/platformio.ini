[env:nodemcuv2]
platform = espressif8266
board = nodemcuv2
framework = arduino

; === БИБЛИОТЕКИ ===
; PlatformIO сам скачает их при первой компиляции
lib_deps = 
    adafruit/DHT sensor library@^1.4.6
    adafruit/Adafruit Unified Sensor@^1.1.14

; === СКОРОСТИ ===
upload_speed = 115200
monitor_speed = 115200