<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>EnrollaDatos (ED) - Monitor</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Roboto+Mono:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css?v=20260917" />
    ...
    <script src="js/app.js?v=20260917"></script>
  </head>
  <body>
    <div class="container" id="app">
      <header class="header">
        <div class="project-name">🕷️ EnrollaDatos (ED)</div>
        <div class="project-version" id="version">—</div>
      </header>

      <section class="network-status">
        <div class="network-label">RED</div>
        <div class="spider-wrapper">
          <img
            class="spider-icon"
            id="spiderIcon"
            src="img/rojo_spider.png"
            alt="spider"
          />
          <div class="status-dot" id="statusDot"></div>
        </div>
        <div class="connection-status" id="connectionStatus">Conectado</div>
      </section>

      <section class="nodes">
        <div class="node-card">
          <span class="node-label">TOTAL</span>
          <span class="node-value" id="totalNodes">—</span>
        </div>
        <div class="node-card active">
          <span class="node-label">ACTIVOS</span>
          <span class="node-value" id="activeNodes">—</span>
        </div>
        <div class="node-card dormant">
          <span class="node-label">DORMIDOS</span>
          <span class="node-value" id="dormantNodes">—</span>
        </div>
      </section>

      <section class="data-transfer">
        <div class="transfer-item receive">
          <span class="transfer-label">RECIBE</span>
          <span class="transfer-time" id="lastReceive">—</span>
        </div>
        <div class="transfer-item transmit">
          <span class="transfer-label">ENVIA</span>
          <span class="transfer-time" id="lastTransmit">—</span>
        </div>
      </section>

      <section class="buffer-status">
        <div class="buffer-card">
          <div class="buffer-header">
            <span class="buffer-label">📦 Hucha</span>
            <span class="buffer-count"
              ><span id="bufferSize">0</span> /
              <span id="bufferMax">30</span></span
            >
          </div>
          <div class="buffer-bar">
            <div class="buffer-bar-fill" id="bufferBar"></div>
          </div>
        </div>
      </section>

      <section class="devices">
        <h2 class="section-title">📋 mecanismos</h2>
        <div class="devices-list" id="devicesList">
          <div class="device-empty">Sin dispositivos</div>
        </div>
      </section>

      <footer class="footer">
        <span>🔄 <span id="updateTime">--:--:--</span></span>
        <span>hecho por Mecaniko</span>
      </footer>

      <div class="debug-panel" id="debug" style="display: none">
        <div class="debug-title">🐞 RAW STATE</div>
        <pre id="debug-state" class="debug-content">—</pre>
      </div>
    </div>

    <script src="js/app.js?v=1.3.2"></script>
  </body>
</html>
