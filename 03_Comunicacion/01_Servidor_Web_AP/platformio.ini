[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

board_build.filesystem = littlefs
board_build.f_flash = 80000000L
board_build.flash_mode = qio
board_upload.flash_size = 8MB
board_build.partitions = default_8MB.csv

; === БИБЛИОТЕКИ ===
lib_deps = 
    ; === me-no-dev/AsyncTCP @ ^1.1.1
     ; === ESP Async WebServer
     ; === bblanchon/ArduinoJson @ ^7.4.3
     ; === adafruit/Adafruit ST7735 and ST7789 Library @ ^1.10.3
     ; === adafruit/Adafruit GFX Library @ ^1.11.11===

     me-no-dev/AsyncTCP@^1.1.1
    ESP Async WebServer@^3.0.6
    bblanchon/ArduinoJson@^7.4.3
    adafruit/Adafruit ST7735 and ST7789 Library@^1.11.0
    adafruit/Adafruit GFX Library@^1.12.6

; === ЗАПРЕЩАЕМ НЕПРАВИЛЬНУЮ БИБЛИОТЕКУ ===
lib_ignore = 
    AsyncTCP_RP2040W

lib_ldf_mode = deep+

; === НАСТРОЙКА USB ===
; === НАСТРОЙКА USB ===
build_flags = 
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DED_VERSION=\"1.3.2\"
    -DED_BUILD_DATE=\"2026-09-17\"

upload_speed = 921600
monitor_speed = 115200

; === ПОРТЫ ===
; COM4 = UART (CH343) → Windows: прошивка + Serial Monitor + команды (setdormant, info)
; USB-OTG → Ubuntu: ttyACM0 (symlink ttyESP32), данные + ACK, здесь не используется
upload_port  = COM4
monitor_port = COM4